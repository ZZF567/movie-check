<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>观影手账</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./assets/icon512.png">
<meta name="theme-color" content="#404040">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Caveat:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap">
<style>
/* ===== 全局重置与变量 ===== */
:root {
  --paper: #f2e8d5;
  --paper-dark: #e8dcc4;
  --ink: #2b2620;
  --ink-soft: #5a5044;
  --accent: #c45c3e;
  --accent-soft: #d98a6e;
  --tape: #f5e6a8;
  --shadow: rgba(43, 38, 32, 0.18);
  --font-hand: 'Caveat', 'ZCOOL XiaoWei', cursive;
  --font-cn: 'ZCOOL XiaoWei', 'Caveat', serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%;
  min-height: 100vh;
  overflow-x: hidden;
  font-family: var(--font-cn);
  color: var(--ink);
  background: var(--paper);
}
/* 牛皮纸颗粒噪点背景 */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    radial-gradient(ellipse at 20% 30%, rgba(180,150,100,0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(160,130,90,0.10) 0%, transparent 50%),
    url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/%3E%3C/svg%3E");
  background-size: auto, auto, 200px 200px;
  pointer-events: none;
  z-index: 0;
  opacity: 0.7;
}
/* ===== 主容器 ===== */
#app {
  position: relative;
  z-index: 1;
  max-width: 480px;
  margin: 0 auto;
  padding: 0 16px 100px;
  min-height: 100vh;
}
/* ===== 头部 ===== */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 24px 4px 16px;
}
.header h1 {
  font-family: var(--font-hand);
  font-size: 38px;
  font-weight: 700;
  letter-spacing: 1px;
  transform: rotate(-1.5deg);
  text-shadow: 1px 1px 0 var(--paper-dark);
}
.header .subtitle {
  font-family: var(--font-cn);
  font-size: 13px;
  color: var(--ink-soft);
  margin-top: -4px;
  letter-spacing: 2px;
}
.wishlist-btn {
  width: 48px;
  height: 48px;
  border: 2.5px solid var(--ink);
  border-radius: 50%;
  background: var(--paper);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 2px 2px 0 var(--ink);
  transition: transform 0.15s, box-shadow 0.15s;
  position: relative;
}
.wishlist-btn:active {
  transform: translate(2px, 2px);
  box-shadow: 0 0 0 var(--ink);
}
.wishlist-btn .badge {
  position: absolute;
  top: -4px;
  right: -4px;
  background: var(--accent);
  color: var(--paper);
  font-family: var(--font-hand);
  font-size: 14px;
  font-weight: 700;
  min-width: 20px;
  height: 20px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--ink);
  padding: 0 4px;
}
/* ===== 月份导航 ===== */
.cal-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 4px 16px;
}
.cal-nav .month-title {
  font-family: var(--font-hand);
  font-size: 30px;
  font-weight: 600;
  transform: rotate(-0.5deg);
}
.nav-arrow {
  width: 40px;
  height: 40px;
  border: 2.5px solid var(--ink);
  border-radius: 50%;
  background: var(--paper);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 2px 2px 0 var(--ink);
  transition: transform 0.15s, box-shadow 0.15s;
}
.nav-arrow:active {
  transform: translate(2px, 2px);
  box-shadow: 0 0 0 var(--ink);
}
/* ===== 日历网格 ===== */
.calendar {
  border: 3px solid var(--ink);
  border-radius: 8px;
  background: rgba(255, 250, 240, 0.5);
  box-shadow: 4px 4px 0 var(--ink);
  overflow: hidden;
  transform: rotate(0.3deg);
}
.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  border-bottom: 2.5px solid var(--ink);
  background: var(--paper-dark);
}
.cal-weekdays span {
  text-align: center;
  padding: 10px 0;
  font-family: var(--font-hand);
  font-size: 18px;
  font-weight: 600;
  color: var(--ink-soft);
}
.cal-weekdays span:first-child,
.cal-weekdays span:last-child {
  color: var(--accent);
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 0;
}
.cal-cell {
  aspect-ratio: 1;
  border-right: 1.5px dashed rgba(43, 38, 32, 0.2);
  border-bottom: 1.5px dashed rgba(43, 38, 32, 0.2);
  padding: 4px;
  position: relative;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: background 0.15s;
}
.cal-cell:nth-child(7n) { border-right: none; }
.cal-cell:nth-last-child(-n+7) { border-bottom: none; }
.cal-cell.other-month {
  opacity: 0.3;
  background: rgba(0,0,0,0.03);
}
.cal-cell.today .day-num {
  background: var(--accent);
  color: var(--paper);
  border: 2px solid var(--ink);
  border-radius: 50%;
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  box-shadow: 1px 1px 0 var(--ink);
}
.day-num {
  font-family: var(--font-hand);
  font-size: 17px;
  font-weight: 600;
  line-height: 1;
  margin-bottom: 2px;
}
.cell-stickers {
  display: flex;
  flex-wrap: wrap;
  gap: 1px;
  justify-content: center;
  align-items: center;
  flex: 1;
  width: 100%;
}
.sticker-mini {
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  filter: drop-shadow(1px 1px 0 rgba(43,38,32,0.3));
}
.sticker-mini img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 3px;
  border: 1.5px solid var(--ink);
}
.sticker-mini svg {
  width: 20px;
  height: 20px;
}
/* ===== 悬浮添加按钮 ===== */
.fab {
  position: fixed;
  bottom: 28px;
  right: calc(50% - 240px + 16px);
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid var(--ink);
  box-shadow: 3px 3px 0 var(--ink);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  transition: transform 0.2s, box-shadow 0.2s;
}
@media (max-width: 512px) {
  .fab { right: 20px; }
}
.fab:active {
  transform: translate(3px, 3px);
  box-shadow: 0 0 0 var(--ink);
}
.fab svg {
  width: 30px;
  height: 30px;
  stroke: var(--paper);
  stroke-width: 3;
  fill: none;
  stroke-linecap: round;
}
/* ===== 浮层通用 ===== */
.overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(43, 38, 32, 0.5);
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
  backdrop-filter: blur(2px);
}
.overlay.active {
  display: flex;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.sheet {
  background: var(--paper);
  border: 3px solid var(--ink);
  border-radius: 16px 16px 0 0;
  width: 100%;
  max-width: 480px;
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.2);
  animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.sheet::before {
  content: '';
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 50px;
  height: 5px;
  background: var(--ink-soft);
  border-radius: 3px;
  opacity: 0.4;
}
.sheet-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 28px 20px 12px;
}
.sheet-title {
  font-family: var(--font-hand);
  font-size: 30px;
  font-weight: 700;
  transform: rotate(-0.8deg);
}
.sheet-close {
  width: 36px;
  height: 36px;
  border: 2.5px solid var(--ink);
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-hand);
  font-size: 22px;
  font-weight: 700;
  color: var(--ink);
  box-shadow: 2px 2px 0 var(--ink);
  transition: transform 0.15s, box-shadow 0.15s;
}
.sheet-close:active {
  transform: translate(2px, 2px);
  box-shadow: 0 0 0 var(--ink);
}
.sheet-body {
  padding: 8px 20px 28px;
}
/* ===== 表单样式 ===== */
.form-group {
  margin-bottom: 18px;
}
.form-label {
  display: block;
  font-family: var(--font-cn);
  font-size: 15px;
  color: var(--ink-soft);
  margin-bottom: 6px;
  letter-spacing: 1px;
}
.form-input,
.form-textarea,
.form-select {
  width: 100%;
  padding: 12px 14px;
  border: 2.5px solid var(--ink);
  border-radius: 8px;
  background: rgba(255, 252, 245, 0.8);
  font-family: var(--font-cn);
  font-size: 16px;
  color: var(--ink);
  outline: none;
  box-shadow: 2px 2px 0 var(--ink);
  transition: box-shadow 0.15s;
}
.form-input:focus,
.form-textarea:focus,
.form-select:focus {
  box-shadow: 3px 3px 0 var(--accent);
}
.form-textarea {
  resize: none;
  min-height: 70px;
}
/* 状态切换 */
.status-toggle {
  display: flex;
  gap: 10px;
}
.status-btn {
  flex: 1;
  padding: 12px;
  border: 2.5px solid var(--ink);
  border-radius: 8px;
  background: transparent;
  font-family: var(--font-cn);
  font-size: 15px;
  cursor: pointer;
  box-shadow: 2px 2px 0 var(--ink);
  transition: all 0.15s;
  color: var(--ink-soft);
}
.status-btn.active {
  background: var(--accent);
  color: var(--paper);
  font-weight: 700;
}
.status-btn:active {
  transform: translate(2px, 2px);
  box-shadow: 0 0 0 var(--ink);
}
/* 关键词标签 */
.keyword-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.kw-tag {
  padding: 6px 14px;
  border: 2px solid var(--ink);
  border-radius: 20px;
  background: transparent;
  font-family: var(--font-cn);
  font-size: 14px;
  cursor: pointer;
  box-shadow: 1.5px 1.5px 0 var(--ink);
  transition: all 0.15s;
  color: var(--ink-soft);
  display: flex;
  align-items: center;
  gap: 5px;
}
.kw-tag.active {
  background: var(--tape);
  color: var(--ink);
  font-weight: 700;
}
.kw-tag:active {
  transform: translate(1.5px, 1.5px);
  box-shadow: 0 0 0 var(--ink);
}
.kw-tag svg {
  width: 16px;
  height: 16px;
}
/* 图片上传 */
.upload-area {
  border: 2.5px dashed var(--ink-soft);
  border-radius: 10px;
  padding: 20px;
  text-align: center;
  cursor: pointer;
  background: rgba(255,252,245,0.5);
  transition: background 0.15s;
}
.upload-area:active {
  background: rgba(255,252,245,0.9);
}
.upload-area p {
  font-family: var(--font-cn);
  font-size: 14px;
  color: var(--ink-soft);
  margin-top: 6px;
}
.upload-preview {
  position: relative;
  display: inline-block;
}
.upload-preview img {
  max-width: 120px;
  max-height: 120px;
  border: 2.5px solid var(--ink);
  border-radius: 8px;
  box-shadow: 2px 2px 0 var(--ink);
  object-fit: cover;
}
.upload-remove {
  position: absolute;
  top: -8px;
  right: -8px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--ink);
  color: var(--paper);
  font-family: var(--font-hand);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
/* 提交按钮 */
.submit-row {
  display: flex;
  gap: 10px;
  margin-top: 24px;
}
.btn-primary,
.btn-secondary,
.btn-danger {
  flex: 1;
  padding: 14px;
  border: 2.5px solid var(--ink);
  border-radius: 10px;
  font-family: var(--font-cn);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 3px 3px 0 var(--ink);
  transition: transform 0.15s, box-shadow 0.15s;
  letter-spacing: 2px;
}
.btn-primary { background: var(--accent); color: var(--paper); }
.btn-secondary { background: var(--paper-dark); color: var(--ink); }
.btn-danger { background: #8b3a2a; color: var(--paper); flex: 0 0 auto; padding: 14px 20px; }
.btn-primary:active,
.btn-secondary:active,
.btn-danger:active {
  transform: translate(3px, 3px);
  box-shadow: 0 0 0 var(--ink);
}
/* ===== 当日详情 ===== */
.detail-date {
  font-family: var(--font-hand);
  font-size: 24px;
  color: var(--ink-soft);
  margin-bottom: 16px;
  padding-left: 4px;
}
.record-card {
  background: rgba(255, 252, 245, 0.85);
  border: 2.5px solid var(--ink);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 14px;
  box-shadow: 3px 3px 0 var(--ink);
  position: relative;
}
.record-card:nth-child(odd) { transform: rotate(-0.5deg); }
.record-card:nth-child(even) { transform: rotate(0.4deg); }
.record-card::before {
  content: '';
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%) rotate(-3deg);
  width: 60px;
  height: 20px;
  background: var(--tape);
  border: 1.5px solid rgba(43,38,32,0.2);
  opacity: 0.85;
}
.record-top {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.record-sticker {
  width: 48px;
  height: 48px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  filter: drop-shadow(2px 2px 0 rgba(43,38,32,0.25));
}
.record-sticker svg { width: 42px; height: 42px; }
.record-sticker img {
  width: 48px;
  height: 48px;
  object-fit: cover;
  border: 2px solid var(--ink);
  border-radius: 6px;
}
.record-info {
  flex: 1;
  min-width: 0;
}
.record-name {
  font-family: var(--font-hand);
  font-size: 22px;
  font-weight: 700;
  line-height: 1.2;
  margin-bottom: 4px;
  word-break: break-word;
}
.record-keyword {
  display: inline-block;
  font-family: var(--font-cn);
  font-size: 12px;
  padding: 2px 10px;
  border: 1.5px solid var(--ink);
  border-radius: 12px;
  background: var(--tape);
  margin-bottom: 6px;
}
.record-note {
  font-family: var(--font-cn);
  font-size: 14px;
  color: var(--ink-soft);
  line-height: 1.5;
  word-break: break-word;
}
.record-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1.5px dashed rgba(43,38,32,0.2);
}
.record-actions button {
  padding: 6px 14px;
  border: 2px solid var(--ink);
  border-radius: 6px;
  background: transparent;
  font-family: var(--font-cn);
  font-size: 13px;
  cursor: pointer;
  box-shadow: 1.5px 1.5px 0 var(--ink);
  transition: transform 0.15s, box-shadow 0.15s;
  color: var(--ink);
}
.record-actions button:active {
  transform: translate(1.5px, 1.5px);
  box-shadow: 0 0 0 var(--ink);
}
.record-actions .del-btn {
  color: var(--accent);
  border-color: var(--accent);
}
.empty-state {
  text-align: center;
  padding: 40px 20px;
}
.empty-state svg {
  width: 60px;
  height: 60px;
  opacity: 0.3;
  margin-bottom: 12px;
}
.empty-state p {
  font-family: var(--font-hand);
  font-size: 22px;
  color: var(--ink-soft);
}
/* ===== 想看清单 ===== */
.wishlist-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(255, 252, 245, 0.85);
  border: 2.5px solid var(--ink);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 10px;
  box-shadow: 2.5px 2.5px 0 var(--ink);
}
.wishlist-item:nth-child(odd) { transform: rotate(-0.4deg); }
.wishlist-item:nth-child(even) { transform: rotate(0.3deg); }
.wishlist-check {
  width: 28px;
  height: 28px;
  border: 2.5px solid var(--ink);
  border-radius: 6px;
  background: transparent;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 1.5px 1.5px 0 var(--ink);
  transition: all 0.15s;
}
.wishlist-check:active {
  transform: translate(1.5px, 1.5px);
  box-shadow: 0 0 0 var(--ink);
}
.wishlist-check.checked {
  background: var(--accent);
}
.wishlist-info {
  flex: 1;
  min-width: 0;
}
.wishlist-name {
  font-family: var(--font-hand);
  font-size: 20px;
  font-weight: 600;
  line-height: 1.2;
  word-break: break-word;
}
.wishlist-note {
  font-family: var(--font-cn);
  font-size: 12px;
  color: var(--ink-soft);
  margin-top: 2px;
  word-break: break-word;
}
.wishlist-del {
  width: 30px;
  height: 30px;
  border: 2px solid var(--accent);
  border-radius: 50%;
  background: transparent;
  color: var(--accent);
  font-family: var(--font-hand);
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
/* 统计条 */
.stats-bar {
  display: flex;
  justify-content: space-around;
  padding: 14px 20px;
  margin: 0 0 16px;
  border: 2.5px solid var(--ink);
  border-radius: 10px;
  background: rgba(255,252,245,0.6);
  box-shadow: 2px 2px 0 var(--ink);
}
.stat-item {
  text-align: center;
}
.stat-num {
  font-family: var(--font-hand);
  font-size: 28px;
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
}
.stat-label {
  font-family: var(--font-cn);
  font-size: 12px;
  color: var(--ink-soft);
  margin-top: 4px;
  letter-spacing: 1px;
}
/* 滚动条美化 */
.sheet::-webkit-scrollbar { width: 4px; }
.sheet::-webkit-scrollbar-track { background: transparent; }
.sheet::-webkit-scrollbar-thumb { background: var(--ink-soft); border-radius: 2px; opacity: 0.3; }
</style>
</head>
<body>
<div id="app">
  <!-- 头部 -->
  <header class="header">
    <div>
      <h1>观影手账</h1>
      <div class="subtitle">MOVIE · JOURNAL</div>
    </div>
    <button class="wishlist-btn" id="wishlistBtn" aria-label="想看清单">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8l-6.2 4.5 2.4-7.4L2 9.4h7.6z"/>
      </svg>
      <span class="badge" id="wishlistBadge" style="display:none">0</span>
    </button>
  </header>
  <!-- 月份导航 -->
  <div class="cal-nav">
    <button class="nav-arrow" id="prevMonth" aria-label="上个月">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

<script>
/* ===== 数据层 ===== */
const STORAGE_KEY = 'movieNote';
// 全局缓存，避免重复读取localStorage
let appRecords = [];

function loadRecords() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}
function saveRecords(records) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  appRecords = JSON.parse(JSON.stringify(records));
}
function genId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
}
/* ===== 关键词 → 手绘SVG 映射 ===== */
const KEYWORDS = [
  { key: '感动', color: '#5b8fb9' },
  { key: '治愈', color: '#a8c8a0' },
  { key: '搞笑', color: '#e8a84c' },
  { key: '恐怖', color: '#6b5b7a' },
  { key: '科幻', color: '#7a9eb8' },
  { key: '热血', color: '#c45c3e' },
  { key: '悲伤', color: '#6a8ca8' },
  { key: '爱情', color: '#c47a8a' }
];
function getKeywordColor(kw) {
  const found = KEYWORDS.find(k => k.key === kw);
  return found ? found.color : '#888';
}
/* 手绘风格SVG图标 */
function svgIcon(kw, size) {
  const c = getKeywordColor(kw);
  const s = size || 24;
  const common = `width="${s}" height="${s}" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"`;
  const stroke = '#2b2620';
  const sw = 2.2;
  switch (kw) {
    case '感动': // 水滴
      return `<svg ${common}>
        <path d="M24 6 C24 6 10 22 10 31 C10 38.7 16.3 44 24 44 C31.7 44 38 38.7 38 31 C38 22 24 6 24 6Z"
          fill="${c}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>
        <path d="M18 28 C16.5 30 16 32.5 17 34.5" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      </svg>`;
    case '治愈': // 云朵
      return `<svg ${common}>
        <path d="M14 34 C8 34 6 28 10 25 C8 20 13 16 18 18 C20 13 28 12 31 17 C37 15 42 20 40 26 C44 29 42 34 37 34 Z"
          fill="${c}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>
        <circle cx="20" cy="26" r="1.5" fill="${stroke}"/>
        <circle cx="29" cy="26" r="1.5" fill="${stroke}"/>
        <path d="M22 30 Q24.5 32 27 30" stroke="${stroke}" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      </svg>`;
    case '搞笑': // 笑脸
      return `<svg ${common}>
        <circle cx="24" cy="24" r="18" fill="${c}" stroke="${stroke}" stroke-width="${sw}"/>
        <circle cx="17" cy="20" r="2.5" fill="${stroke}"/>
        <circle cx="31" cy="20" r="2.5" fill="${stroke}"/>
        <path d="M15 27 Q24 38 33 27" stroke="${stroke}" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <path d="M13 16 Q15 13 18 15" stroke="${stroke}" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <path d="M30 15 Q33 13 35 16" stroke="${stroke}" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      </svg>`;
    case '恐怖': // 月亮+暗影
      return `<svg ${common}>
        <circle cx="24" cy="24" r="18" fill="${c}" stroke="${stroke}" stroke-width="${sw}"/>
        <path d="M30 10 C22 12 18 18 19 26 C20 33 26 38 33 37 C25 36 19 30 20 23 C21 17 25 12 30 10Z"
          fill="${stroke}" opacity="0.7"/>
        <circle cx="16" cy="18" r="1.2" fill="#fff" opacity="0.5"/>
        <circle cx="14" cy="28" r="0.8" fill="#fff" opacity="0.4"/>
      </svg>`;
    case '科幻': // 星星
      return `<svg ${common}>
        <path d="M24 4 L28 18 L43 18 L31 27 L35 42 L24 33 L13 42 L17 27 L5 18 L20 18 Z"
          fill="${c}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>
        <circle cx="38" cy="10" r="1.5" fill="${stroke}"/>
        <circle cx="10" cy="36" r="1.2" fill="${stroke}"/>
        <circle cx="40" cy="34" r="1" fill="${stroke}"/>
      </svg>`;
    case '热血': // 火焰
      return `<svg ${common}>
        <path d="M24 4 C24 4 14 16 14 26 C14 32 18 36 20 34 C19 30 22 28 22 24 C22 24 18 20 20 14 C22 16 26 18 27 22 C28 18 32 16 33 12 C36 16 38 22 36 27 C38 28 39 31 38 34 C37 40 31 44 24 44 C16 44 10 39 10 32 C10 22 24 4 24 4Z"
          fill="${c}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>
        <path d="M22 32 C21 35 23 38 25 37 C27 36 26 33 24 32" fill="#f5d76e" opacity="0.8"/>
      </svg>`;
    case '悲伤': // 雨云
      return `<svg ${common}>
        <path d="M12 26 C7 26 5 21 8 19 C7 15 11 12 15 13 C17 9 24 9 27 13 C32 12 36 16 35 21 C38 23 37 26 33 26 Z"
          fill="${c}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>
        <line x1="16" y1="32" x2="14" y2="38" stroke="#5b8fb9" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="24" y1="33" x2="22" y2="40" stroke="#5b8fb9" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="32" y1="32" x2="30" y2="38" stroke="#5b8fb9" stroke-width="2.2" stroke-linecap="round"/>
      </svg>`;
    case '爱情': // 爱心
      return `<svg ${common}>
        <path d="M24 42 C24 42 6 30 6 18 C6 11 11 6 17 6 C21 6 23 8 24 10 C25 8 27 6 31 6 C37 6 42 11 42 18 C42 30 24 42 24 42Z"
          fill="${c}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>
        <path d="M14 14 C12 16 11 19 13 21" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      </svg>`;
    default:
      return `<svg ${common}><circle cx="24" cy="24" r="16" fill="${c}" stroke="${stroke}" stroke-width="${sw}"/></svg>`;
  }
}
/* ===== 状态 ===== */
let currentDate = new Date();
let currentYear = currentDate.getFullYear();
let currentMonth = currentDate.getMonth();
let selectedKeyword = '';
let currentImageData = '';
let currentStatus = 'watched';
/* ===== DOM 引用 ===== */
const $ = id => document.getElementById(id);
const calGrid = $('calGrid');
const monthTitle = $('monthTitle');
/* ===== 日历渲染 ===== */
function renderCalendar() {
  const firstDay = new Date(currentYear, currentMonth, 1);
  const lastDay = new Date(currentYear, currentMonth + 1, 0);
  const startWeekday = firstDay.getDay();
  const daysInMonth = lastDay.getDate();
  const prevMonthDays = new Date(currentYear, currentMonth, 0).getDate();
  monthTitle.textContent = `${currentYear}年 ${currentMonth + 1}月`;
  // 使用全局缓存数据，避免重复读localStorage
  const records = appRecords;
  const today = new Date();
  const todayStr = formatDate(today);
  let html = '';
  // 上个月填充
  for (let i = startWeekday - 1; i >= 0; i--) {
    const day = prevMonthDays - i;
    html += `<div class="cal-cell other-month"><span class="day-num">${day}</span></div>`;
  }
  // 当月
  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const isToday = dateStr === todayStr;
    const dayRecords = records.filter(r => r.status === 'watched' && r.date === dateStr);
    let stickersHtml = '';
    dayRecords.slice(0, 4).forEach(r => {
      const rot = (Math.random() * 10 - 5).toFixed(1);
      if (r.image) {
        stickersHtml += `<div class="sticker-mini" style="transform:rotate(${rot}deg)"><img src="${r.image}" alt=""></div>`;
      } else if (r.keyword) {
        stickersHtml += `<div class="sticker-mini" style="transform:rotate(${rot}deg)">${svgIcon(r.keyword, 20)}</div>`;
      }
    });
    if (dayRecords.length > 4) {
      stickersHtml += `<div class="sticker-mini" style="font-family:var(--font-hand);font-size:12px;color:var(--ink-soft)">+${dayRecords.length - 4}</div>`;
    }
    html += `<div class="cal-cell${isToday ? ' today' : ''}" data-date="${dateStr}">
      <span class="day-num">${day}</span>
      <div class="cell-stickers">${stickersHtml}</div>
    </div>`;
  }
  // 下个月填充
  const totalCells = startWeekday + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= remaining; i++) {
    html += `<div class="cal-cell other-month"><span class="day-num">${i}</span></div>`;
  }
  calGrid.innerHTML = html;
  // 绑定日期点击
  calGrid.querySelectorAll('.cal-cell[data-date]').forEach(cell => {
    cell.addEventListener('click', () => {
      openDetail(cell.dataset.date);
    });
  });
}
function formatDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')
